name: Update PSE generation per unit

on:
  workflow_dispatch:

  schedule:
    # GitHub Actions używa czasu UTC.
    # Workflow uruchamia się 4 razy dziennie:
    # 00:00, 06:00, 12:00, 18:00 UTC
    #
    # W Polsce:
    # czas letni: 02:00, 08:00, 14:00, 20:00
    # czas zimowy: 01:00, 07:00, 13:00, 19:00
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: pse-auto-update-generation
  cancel-in-progress: false

jobs:
  update-pse-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run PSE auto update script
        run: |
          python pse_auto_update_generation.py

      - name: Commit and push updated CSV files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          echo "Files in repository:"
          ls -lh

          echo "Git status before add:"
          git status --short

          # Dodaj pliki tylko jeśli istnieją
          for file in \
            PSE_generation_per_unit_since_10_march.csv \
            PSE_generation_per_unit_failed.csv \
            PSE_generation_per_unit_since_10_march_backup_latest.csv
          do
            if [ -f "$file" ]; then
              git add "$file"
            fi
          done

          echo "Git status after add:"
          git status --short

          # Jeśli nic się nie zmieniło, zakończ workflow bez błędu
          if git diff --cached --quiet; then
            echo "No CSV changes to commit."
            exit 0
          fi

          git commit -m "Update PSE generation per unit data"

          # Pobierz ewentualne zmiany, które pojawiły się
          # w repozytorium podczas działania workflow
          git pull --rebase origin main

          git push origin main
